name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Compact Contracts & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Install & Setup Compact Compiler (Optional)
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh 2>/dev/null || true
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/compact update 2>/dev/null || true
        continue-on-error: true

      - name: Compile Compact Contracts
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npm run compile || echo "Using pre-compiled contract artifacts in managed/bidveil"

      - name: Run Test Suite
        run: npm test

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Vite Production Assets
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f dist/index.html && echo "✓ Frontend build verified successfully"
